# ai-check-fast.yml — fast check workflow（PR のみ、軽い検証）
#
# 配布される example。本リポ自身用ではなく、利用者がコピーして自プロジェクトの
# .github/workflows/ に配置して使うことを想定。
#
# 思想:
#   - Edit hook（fast）と同じセットを CI でも実行し、AI 内部ループと PR Gate を同期
#   - Static check + Unit test までに限定（Integration / E2E / Diagnostic は `ai-check.yml` 側）
#   - PR push のたびに走るため timeout は短く保つ（10 分以内目安）
#
# Edit hook との同期:
#   - Claude Code の Edit hook で `pnpm ai:check:fast` を実行する設定と同じスクリプトを呼ぶ
#   - 詳細は package-templates/.claude/settings.hook-fragment.json（別 SPEC で提供予定）
#
# カスタマイズ可能箇所:
#   1. パッケージマネージャ・Node version（ai-check.yml と同様）
#   2. timeout — fast の意義を保つため 10 分以内推奨

name: AI Check (Fast)

on:
  pull_request:

permissions:
  contents: read

jobs:
  ai-check-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ai:check:fast は package.scripts.fragment.json で定義する軽量スクリプト
      # 例: "ai:check:fast": "pnpm typecheck && pnpm lint && pnpm test:unit"
      - name: Run ai:check:fast
        run: pnpm ai:check:fast

# --- monorepo: paths filter (opt-in) ---
# 変更パッケージのみで fast check を起動する opt-in 雛形。既定は無効（下記はコメント）。
# monorepo で対象外パッケージの PR まで fast を回したくない場合に有効化する。
# 詳細は docs/github-actions.md の monorepo 節を参照。
#
# 有効化する場合、上部の `on:` ブロックを次の形に置き換える。
# SPEC-0061 の `--workspace <pkg-dir>` の対象ディレクトリを paths glob に指定する
# （例: packages/app）:
#
# on:
#   pull_request:
#     paths:
#       - 'packages/app/**'
#       # 共有設定の変更でも起動したい場合は横断パスも足す:
#       # - 'package.json'
#       # - 'pnpm-lock.yaml'
#
# 注意（required check が pending のままになる問題）:
#   paths filter で「対象外パスだけを変更した PR」は全 job がスキップされる。
#   その job を required status check にしていると never-run のまま pending となり
#   マージがブロックされる。回避策は「常に成功する fallback job を required に指定する」
#   等。詳細は docs/github-actions.md の monorepo 節を参照。
# ※ セキュリティスキャンや matrix の雛形は fast には置かない
#   （fast の軽量性を保つため、それらは ai-check.yml 側だけに用意する）。
